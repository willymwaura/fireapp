{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Fire report page</title>
    <style>
        body {
            align-items: center;
            background-color: #000;
            display: flex;
            justify-content: center;
            height: 100vh;
          }
          
          .form {
            background-color: #15172b;
            border-radius: 20px;
            box-sizing: border-box;
            height: 500px;
            padding: 20px;
            width: 320px;
          }
          
          .title {
            color: #eee;
            font-family: sans-serif;
            font-size: 36px;
            font-weight: 600;
            margin-top: 30px;
          }
          
          .subtitle {
            color: #eee;
            font-family: sans-serif;
            font-size: 16px;
            font-weight: 600;
            margin-top: 10px;
          }
          
          .input-container {
            height: 50px;
            position: relative;
            width: 100%;
          }
          
          .ic1 {
            margin-top: 40px;
          }
          
          .ic2 {
            margin-top: 30px;
          }
          
          .input {
            background-color: #303245;
            border-radius: 12px;
            border: 0;
            box-sizing: border-box;
            color: #eee;
            font-size: 18px;
            height: 100%;
            outline: 0;
            padding: 4px 20px 0;
            width: 100%;
          }
          
          .cut {
            background-color: #15172b;
            border-radius: 10px;
            height: 20px;
            left: 20px;
            position: absolute;
            top: -20px;
            transform: translateY(0);
            transition: transform 200ms;
            width: 76px;
          }
          
          .cut-short {
            width: 50px;
          }
          
          .input:focus ~ .cut,
          .input:not(:placeholder-shown) ~ .cut {
            transform: translateY(8px);
          }
          
          .placeholder {
            color: #65657b;
            font-family: sans-serif;
            left: 20px;
            line-height: 14px;
            pointer-events: none;
            position: absolute;
            transform-origin: 0 50%;
            transition: transform 200ms, color 200ms;
            top: 20px;
          }
          
          .input:focus ~ .placeholder,
          .input:not(:placeholder-shown) ~ .placeholder {
            transform: translateY(-30px) translateX(10px) scale(0.75);
          }
          
          .input:not(:placeholder-shown) ~ .placeholder {
            color: #808097;
          }
          
          .input:focus ~ .placeholder {
            color: #dc2f55;
          }
          
          .submit {
            background-color: #08d;
            border-radius: 12px;
            border: 0;
            box-sizing: border-box;
            color: #eee;
            cursor: pointer;
            font-size: 18px;
            height: 50px;
            margin-top: 38px;
            // outline: 0;
            text-align: center;
            width: 100%;
          }
          
          .submit:active {
            background-color: #06b;
          }
        </style>
</head>

<body>
  <form id="reportForm" method="post" action="{% url 'report_fire' %}">
    {% csrf_token %}
    
    <div class="form">
        <div class="subtitle" style="color:red;">KIAMBU COUNTY FIRE DEPARTMENT</div>
       
        <div class="input-container ic1">
            <input id="phoneNumber" name="phoneNumber" class="input" type="text" placeholder=" " />
            <div class="cut"></div>
            <label for="phoneNumber" class="placeholder">phoneNumber</label>
        </div>
        <div class="input-container ic2">
            <input id="message" class="input" type="text" placeholder=" " name="message" />
            <div class="cut"></div>
            <label for ="message" class="placeholder">Message</label>
        </div>
        <input type="hidden" id="latitude" name="latitude" value="">
        <input type="hidden" id="longitude" name="longitude" value="">
        {% if message %}
        <div class="input-container ic2">
          {{ message }}
          
       </div>
       {% endif %}
       
        <button type="text" id="submitReport" class="submit">Report Fire</button>
      
    </div>
    <a href="{% url 'login_page' %}">Login</a>
    <a href="{% url 'heatmap' %}">See fire heatmap</a>
    <a href="{% url 'preventitive' %}">Fire preventitive mesaures</a>
    
   
  </form>
  <p id="coordinates"></p>
    
  <script>
    document.getElementById("submitReport").addEventListener("click", function() {
      if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
              function(position) {
                  var latitude = position.coords.latitude;
                  var longitude = position.coords.longitude;
                  console.log(latitude);
                  console.log(longitude);
                  console.log("the coordinates are above ");
                  document.getElementById("latitude").value = latitude;
                  document.getElementById("longitude").value = longitude;
  
                  // After setting the values, manually submit the form
                  document.getElementById("reportForm").submit();
              },
              function(error) {
                  switch(error.code) {
                      case error.PERMISSION_DENIED:
                          console.error("User denied the request for geolocation.");
                          break;
                      case error.POSITION_UNAVAILABLE:
                          console.error("Location information is unavailable.");
                          break;
                      case error.TIMEOUT:
                          console.error("The request to get user location timed out.");
                          break;
                      case error.UNKNOWN_ERROR:
                          console.error("An unknown error occurred.");
                          break;
                  }
              }
          );
      } else {
          console.error("Geolocation is not supported by this browser.");
      }
  });
  
  </script>
</body>
</html>
